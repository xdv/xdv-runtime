# XDV Runtime Workspace Manifest
# User Space Runtime for XDV OS

[workspace]
name = "xdv_runtime"
version = "0.3.0"
description = "XDV Runtime - Hybrid ABI runtime with capability/contract-aware domain calls and deterministic replay/telemetry hooks"

[sector]
name = "xdv_runtime"
path = "src"

[dependencies]
# Core DPL libraries
dustlib = { path = "../dustlib" }
dustlib_k = { path = "../dustlib-k" }

[target.x64-pc-none]
linker = "ld"
linker_flags = ["-nostdlib", "-static"]