# XDV Runtime Workspace Manifest
# User Space Runtime for XDV OS

[workspace]
name = "xdv_runtime"
version = "0.2.0"
description = "XDV Runtime - User space runtime for XDV OS"

[sector]
name = "xdv_runtime"
path = "src"

[dependencies]
# Core DPL libraries
dustlib = { path = "../dustlib" }
dustlib_k = { path = "../dustlib-k" }

[target.x64-pc-none]
linker = "ld"
linker_flags = ["-nostdlib", "-static"]

